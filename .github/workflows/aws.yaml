name: Receipt OCR & Document Intelligence CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
  EKS_CLUSTER_NAME: receipt-ocr-cluster
  KUBERNETES_NAMESPACE: receipt-ocr
  CONTAINER_NAME: receipt-ocr-api
  CONTAINER_PORT: 8000
  PYTHON_VERSION: "3.11"

jobs:

  # ==========================================================
  # CONTINUOUS INTEGRATION
  # ==========================================================

  integration:
    name: Test Receipt OCR Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Display Environment
        run: |
          python --version
          python -m pip --version

      - name: Upgrade Packaging Tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

      - name: Install Project Dependencies
        run: |
          python -m pip install \
            -r requirements.txt

      - name: Verify Critical Imports
        run: |
          python - <<'PY'
          import fastapi
          import starlette
          import pydantic
          import uvicorn
          import pytest

          print("FastAPI:", fastapi.__version__)
          print("Starlette:", starlette.__version__)
          print("Pydantic:", pydantic.__version__)
          print("Uvicorn:", uvicorn.__version__)
          print("Pytest:", pytest.__version__)

          from app import app

          print("FastAPI application import: OK")
          print("Application:", app.title)
          PY

      - name: Compile Python Source
        run: |
          python -m compileall -q app.py src

      - name: Run Unit and API Tests
        run: |
          pytest \
            -q \
            --disable-warnings \
            --maxfail=1 \
            --cov=src \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: receipt-ocr-test-results
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

      # ======================================================
      # BUILD IMAGE
      # ======================================================

      - name: Build Docker Image Locally
        run: |
          docker build \
            --pull \
            --tag receipt-ocr-api:${{ github.sha }} \
            .

      - name: Docker Image Inspection
        run: |
          docker image inspect receipt-ocr-api:${{ github.sha }}
          docker images receipt-ocr-api

      # ======================================================
      # DOCKER SMOKE TEST
      # ======================================================

      - name: Docker Smoke Test
        run: |

          docker run -d \
            --name receipt-ocr-test \
            -p 8000:8000 \
            receipt-ocr-api:${{ github.sha }}

          echo "Waiting for container startup..."

          READY=0

          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8000/health/live; then

              echo
              echo "Application is alive."

              READY=1
              break

            fi

            echo "Waiting for application..."
            sleep 5

          done

          if [ "${READY}" -ne 1 ]; then
            echo "Container failed to become alive."
            docker logs receipt-ocr-test
            exit 1
          fi

          echo "Checking application health..."

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8000/health

          echo

          echo "Checking API information..."

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8000/api/info

          echo

          docker logs receipt-ocr-test

      - name: Cleanup Docker Smoke Test
        if: always()
        run: |
          docker rm -f receipt-ocr-test || true


  # ==========================================================
  # BUILD AND PUSH TO AMAZON ECR
  # ==========================================================

  build-and-push:
    name: Build and Push Docker Image
    needs: integration

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsReceiptOCR

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}"

      - name: Set Image Metadata
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "${GITHUB_ENV}"

      - name: Build Docker Image
        run: |

          docker build \
            --pull \
            --tag "${IMAGE_URI}" \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .

      - name: Push Commit SHA Image
        run: |
          docker push "${IMAGE_URI}"

      - name: Push Latest Image
        run: |
          docker push \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Verify Published Image
        run: |
          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}"


  # ==========================================================
  # CONTINUOUS DEPLOYMENT TO AMAZON EKS
  # ==========================================================

  deployment:
    name: Deploy Receipt OCR API to EKS

    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v6


      # ======================================================
      # AWS AUTHENTICATION
      # ======================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsReceiptOCRDeploy


      # ======================================================
      # VERIFY AWS
      # ======================================================

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity


      # ======================================================
      # VERIFY EKS CLUSTER
      # ======================================================

      - name: Verify EKS Cluster
        run: |

          aws eks describe-cluster \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}" \
            --query 'cluster.status' \
            --output text


      # ======================================================
      # INSTALL KUBECTL
      # ======================================================

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest


      # ======================================================
      # CONFIGURE KUBECONFIG
      # ======================================================

      - name: Configure kubeconfig
        run: |

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

          kubectl cluster-info

          kubectl get nodes


      # ======================================================
      # VERIFY ECR IMAGE
      # ======================================================

      - name: Verify ECR Image
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "Deploying image:"
          echo "${IMAGE_URI}"

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}"


      # ======================================================
      # CREATE NAMESPACE
      # ======================================================

      - name: Create Kubernetes Namespace
        run: |

          kubectl apply \
            -f deployment/eks/namespace.yaml


      # ======================================================
      # CREATE IMAGE URI
      # ======================================================

      - name: Set Deployment Image
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"


      # ======================================================
      # DEPLOY APPLICATION
      # ======================================================

      - name: Deploy Receipt OCR API
        run: |

          sed \
            "s|IMAGE_URI_PLACEHOLDER|${IMAGE_URI}|g" \
            deployment/eks/deployment.yaml \
            > /tmp/receipt-ocr-deployment.yaml

          kubectl apply \
            -f /tmp/receipt-ocr-deployment.yaml


      # ======================================================
      # DEPLOY SERVICE
      # ======================================================

      - name: Deploy Kubernetes Service
        run: |

          kubectl apply \
            -f deployment/eks/service.yaml


      # ======================================================
      # SHOW KUBERNETES RESOURCES
      # ======================================================

      - name: Show Kubernetes Resources
        run: |

          kubectl get namespace

          kubectl get deployment \
            -n "${KUBERNETES_NAMESPACE}"

          kubectl get pods \
            -n "${KUBERNETES_NAMESPACE}"

          kubectl get service \
            -n "${KUBERNETES_NAMESPACE}"


      # ======================================================
      # WAIT FOR ROLLOUT
      # ======================================================

      - name: Wait for Deployment Rollout
        run: |

          kubectl rollout status \
            deployment/receipt-ocr-api \
            -n "${KUBERNETES_NAMESPACE}" \
            --timeout=10m


      # ======================================================
      # VERIFY POD
      # ======================================================

      - name: Verify Pod Status
        run: |

          kubectl get pods \
            -n "${KUBERNETES_NAMESPACE}" \
            -o wide

          kubectl describe deployment \
            receipt-ocr-api \
            -n "${KUBERNETES_NAMESPACE}"


      # ======================================================
      # VERIFY SERVICE
      # ======================================================

      - name: Verify Service
        run: |

          kubectl get service \
            receipt-ocr-api \
            -n "${KUBERNETES_NAMESPACE}"


      # ======================================================
      # WAIT FOR LOAD BALANCER
      # ======================================================

      - name: Wait for LoadBalancer
        shell: bash
        run: |

          echo "Waiting for AWS LoadBalancer..."

          for i in {1..30}; do

            HOSTNAME=$(kubectl get service \
              receipt-ocr-api \
              -n "${KUBERNETES_NAMESPACE}" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "${HOSTNAME}" ]; then

              echo "LoadBalancer hostname:"
              echo "${HOSTNAME}"

              echo "LOAD_BALANCER_HOST=${HOSTNAME}" >> "${GITHUB_ENV}"

              break

            fi

            echo "Waiting for LoadBalancer..."
            sleep 10

          done


      # ======================================================
      # APPLICATION HEALTH CHECK
      # ======================================================

      - name: Verify Kubernetes Application
        shell: bash
        run: |

          echo "Checking pod health..."

          kubectl get pods \
            -n "${KUBERNETES_NAMESPACE}"

          echo "Checking recent application logs..."

          kubectl logs \
            deployment/receipt-ocr-api \
            -n "${KUBERNETES_NAMESPACE}" \
            --tail=100


      # ======================================================
      # DEPLOYMENT SUMMARY
      # ======================================================

      - name: Deployment Summary
        run: |

          echo "=========================================="
          echo "Receipt OCR Deployment Complete"
          echo "=========================================="

          echo "Cluster:"
          echo "${EKS_CLUSTER_NAME}"

          echo "Namespace:"
          echo "${KUBERNETES_NAMESPACE}"

          echo "Image:"
          echo "${IMAGE_URI}"

          echo "LoadBalancer:"
          echo "${LOAD_BALANCER_HOST:-pending}"

          echo "=========================================="
