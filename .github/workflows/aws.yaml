name: Receipt OCR & Document Intelligence CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
  CONTAINER_NAME: receipt-ocr-api
  HOST_PORT: 8000
  CONTAINER_PORT: 8000
  PYTHON_VERSION: "3.11"

jobs:

  # ==========================================================
  # CONTINUOUS INTEGRATION
  # ==========================================================

  integration:
    name: Test Receipt OCR Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Display Environment
        run: |
          python --version
          python -m pip --version

      - name: Upgrade Packaging Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Project Dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Verify Critical Imports
        run: |
          python - <<'PY'
          import fastapi
          import starlette
          import pydantic
          import uvicorn
          import pytest

          print("FastAPI:", fastapi.__version__)
          print("Starlette:", starlette.__version__)
          print("Pydantic:", pydantic.__version__)
          print("Uvicorn:", uvicorn.__version__)
          print("Pytest:", pytest.__version__)

          from app import app

          print("FastAPI application import: OK")
          print("Application:", app.title)
          PY

      - name: Compile Python Source
        run: |
          python -m compileall -q app.py src

      - name: Run Unit and API Tests
        run: |
          pytest \
            -q \
            --disable-warnings \
            --maxfail=1 \
            --cov=src \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: receipt-ocr-test-results
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

      - name: Build Docker Image Locally
        run: |
          docker build \
            --pull \
            --tag receipt-ocr-api:${{ github.sha }} \
            .

      - name: Docker Image Inspection
        run: |
          docker image inspect receipt-ocr-api:${{ github.sha }}
          docker images receipt-ocr-api

      - name: Docker Smoke Test
        run: |
          docker network create receipt-ocr-test-network

          docker run -d \
            --name receipt-ocr-test \
            --network receipt-ocr-test-network \
            -p 8000:8000 \
            receipt-ocr-api:${{ github.sha }}

          echo "Waiting for container startup..."

          for i in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/health/live; then
              echo
              echo "Application is alive."
              break
            fi

            echo "Waiting for application..."
            sleep 5
          done

          curl --fail \
            http://127.0.0.1:8000/health

          docker logs receipt-ocr-test

      - name: Cleanup Docker Smoke Test
        if: always()
        run: |
          docker rm -f receipt-ocr-test || true
          docker network rm receipt-ocr-test-network || true

  # ==========================================================
  # BUILD AND PUSH
  # ==========================================================

  build-and-push:
    name: Build and Push Docker Image
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsReceiptOCR

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}"

      - name: Set Image Metadata
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Build Docker Image
        run: |
          docker build \
            --pull \
            --tag "${IMAGE_URI}" \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .

      - name: Push Commit-SHA Image
        run: |
          docker push "${IMAGE_URI}"

      - name: Update Latest Tag
        run: |
          docker push \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Verify Published Image
        run: |
          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}"

  # ==========================================================
  # CONTINUOUS DEPLOYMENT
  # ==========================================================

  deployment:
    name: Deploy Receipt OCR API
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    #environment:
     # name: production

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsReceiptOCRDeploy

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image URI
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Pull New Docker Image
        run: |
          docker pull "${IMAGE_URI}"

      - name: Save Existing Deployment
        shell: bash
        run: |
          if docker ps -a --format '{{.Names}}' | grep -Fxq "${CONTAINER_NAME}"; then
            echo "Existing container found."

            docker inspect \
              "${CONTAINER_NAME}" \
              --format='{{.Config.Image}}' \
              > previous-image.txt || true

            cat previous-image.txt || true

            docker stop "${CONTAINER_NAME}" || true

            docker rename \
              "${CONTAINER_NAME}" \
              "${CONTAINER_NAME}-previous" || true
          else
            echo "No existing deployment found."
            : > previous-image.txt
          fi

      - name: Remove Previous Port Owner
        shell: bash
        run: |
          docker ps -q \
            --filter "publish=${HOST_PORT}" \
            | xargs -r docker stop

          docker ps -aq \
            --filter "publish=${HOST_PORT}" \
            | xargs -r docker rm -f

      - name: Start New Deployment
        run: |
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            -p "${HOST_PORT}:${CONTAINER_PORT}" \
            -e PYTHONUNBUFFERED=1 \
            "${IMAGE_URI}"

      - name: Wait for Application Readiness
        shell: bash
        run: |
          set -e

          echo "Waiting for Receipt OCR API..."

          READY=0

          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              --show-error \
              "http://127.0.0.1:${HOST_PORT}/health/ready"; then

              echo
              echo "Application is ready."
              READY=1
              break

            fi

            echo "Attempt ${i}/30 failed. Retrying..."
            sleep 10

          done

          if [ "${READY}" -ne 1 ]; then
            echo "Application failed readiness check."
            exit 1
          fi

      - name: Verify Production Health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:${HOST_PORT}/health

          echo

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:${HOST_PORT}/health/live

          echo

      - name: Verify API Documentation
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:${HOST_PORT}/api/docs \
            > /dev/null

      - name: Show Deployment
        run: |
          docker ps
          docker logs --tail 200 "${CONTAINER_NAME}"

      # ======================================================
      # AUTOMATIC ROLLBACK
      # ======================================================

      - name: Rollback Failed Deployment
        if: failure()
        shell: bash
        run: |
          echo "Deployment failed. Starting rollback."

          docker logs --tail 300 "${CONTAINER_NAME}" || true

          docker stop "${CONTAINER_NAME}" || true
          docker rm -f "${CONTAINER_NAME}" || true

          if [ -f previous-image.txt ] && [ -s previous-image.txt ]; then

            PREVIOUS_IMAGE=$(cat previous-image.txt)

            echo "Previous image: ${PREVIOUS_IMAGE}"

            docker pull "${PREVIOUS_IMAGE}"

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p "${HOST_PORT}:${CONTAINER_PORT}" \
              -e PYTHONUNBUFFERED=1 \
              "${PREVIOUS_IMAGE}"

            echo "Waiting for rollback recovery..."

            for i in {1..20}; do

              if curl \
                --fail \
                --silent \
                http://127.0.0.1:${HOST_PORT}/health/ready; then

                echo
                echo "Rollback successful."
                exit 0

              fi

              sleep 5

            done

            echo "Rollback health check failed."
            docker logs --tail 300 "${CONTAINER_NAME}"
            exit 1

          else

            echo "No previous deployment available for rollback."
            exit 1

          fi

      - name: Cleanup Previous Container
        if: success()
        shell: bash
        run: |
          docker rm -f \
            "${CONTAINER_NAME}-previous" \
            || true

      - name: Remove Old Docker Images
        if: success()
        shell: bash
        run: |
          docker image prune -af || true