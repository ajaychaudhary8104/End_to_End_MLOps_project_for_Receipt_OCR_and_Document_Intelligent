artifacts_root: artifacts


data_ingestion:
  root_dir: artifacts/data_ingestion
  source_URL: https://drive.google.com/file/d/1WVRlflI5jIZEeW39xMn1SDV005WSUUmI/view
  local_data_file: artifacts/data_ingestion/data.zip
  unzip_dir: artifacts/data_ingestion/AI-OCR dataset

data_validation:
  root_dir: artifacts/data_validation
  data_dir: artifacts/data_ingestion/AI-OCR dataset
  report_dir: artifacts/data_validation
  min_width: 100
  min_height: 100
  max_width: 10000
  max_height: 10000
  min_file_size_bytes: 1024
  max_file_size_mb: 25
  supported_extensions: [".jpg", ".jpeg", ".png", ".webp", ".bmp", ".tif", ".tiff", ".JPG", ".JPEG", ".PNG"]
  recursive: True
  fail_on_empty_dataset: True
  fail_on_corrupt_images: False
  duplicate_detection: True
  generate_report: True  

image_preprocessing:
  root_dir: artifacts/image_preprocessing
  input_dir: artifacts/data_ingestion/AI-OCR dataset
  output_dir: artifacts/image_preprocessing/preprocessed_images
  target_width: 1600
  min_width: 100
  min_height: 100
  denoise: True
  clahe: True
  adaptive_threshold: False
  deskew: True
  perspective_correction: True
  grayscale: True
  save_intermediate: False
  output_extension: ".png"
  jpeg_quality: 95
  max_rotation_angle: 45.0
  supported_extensions: [".jpg", ".jpeg", ".png", ".webp", ".bmp", ".tif", ".tiff", ".JPG", ".JPEG", ".PNG"]

ocr_engine:
  root_dir: artifacts/ocr_engine
  input_dir: artifacts/image_preprocessing/preprocessed_images
  output_dir: artifacts/ocr_engine/ocr_results
  model_name: PP-OCRv5
  language: en
  device: cpu
  text_detection_score_threshold: 0.30
  text_recognition_score_threshold: 0.30
  use_doc_orientation_classify: False
  use_doc_unwarping: False
  use_textline_orientation: False
  save_visualization: False
  recursive: True
  supported_extensions: [".jpg", ".jpeg", ".png", ".webp", ".bmp", ".tif", ".tiff", ".JPG", ".JPEG", ".PNG"]

ocr_text_cleaning:
  root_dir: artifacts/ocr_text_cleaning
  input_dir: artifacts/ocr_engine/ocr_results
  output_dir: artifacts/ocr_text_cleaning
  min_text_length: 1
  normalize_unicode: True
  normalize_whitespace: True
  normalize_currency: True
  normalize_common_ocr_errors: True
  normalize_dates: True
  preserve_case: True
  remove_control_characters: True
  deduplicate_adjacent_lines: True
  remove_empty_lines: True
  confidence_round_digits: 4

field_extraction_engine:
  root_dir: artifacts/field_extraction_engine
  input_dir: artifacts/ocr_text_cleaning
  output_dir: artifacts/field_extraction_engine/extracted_fields
  vendor_search_lines: 8
  min_item_name_length: 2
  max_item_name_length: 80
  min_item_price: 0.0
  max_item_price: 1000000
  total_keywords: [
      "GRAND TOTAL",
      "TOTAL AMOUNT",
      "AMOUNT PAYABLE",
      "NET AMOUNT",
      "TOTAL DUE",
      "BALANCE DUE",
      "TOTAL",
  ]
  date_search_lines: 20
  total_search_last_lines: 12
  reject_keywords: [
      "TOTAL",
      "SUBTOTAL",
      "TAX",
      "VAT",
      "GST",
      "CGST",
      "SGST",
      "IGST",
      "DISCOUNT",
      "CHANGE",
      "CASH",
      "CARD",
      "CREDIT",
      "DEBIT",
      "PAYMENT",
      "INVOICE",
      "RECEIPT",
      "DATE",
      "TIME",
      "PHONE",
      "TEL",
      "ADDRESS",
      "THANK",
  ]
  confidence_round_digits: 4

confidence_and_reliability_engine:
  root_dir: artifacts/confidence_and_reliability_engine
  input_dir: artifacts/field_extraction_engine/extracted_fields
  ocr_dir: artifacts/ocr_engine/ocr_results
  cleaned_ocr_dir: artifacts/ocr_text_cleaning
  output_dir: artifacts/confidence_and_reliability_engine
  low_confidence_threshold: 0.70
  medium_confidence_threshold: 0.90
  ocr_weight: 0.50
  pattern_weight: 0.30
  context_weight: 0.20
  conflict_penalty: 0.15
  item_count_mismatch_penalty: 0.20
  absolute_total_tolerance: 1.00
  relative_total_tolerance: 0.05
  confidence_digits: 4
  save_manifest: True  

json_generation:
  root_dir: artifacts/json_generation
  input_dir: artifacts/confidence_and_reliability_engine
  output_dir: artifacts/json_generation/json_output

  # --------------------------------------------------------
  # Confidence metadata
  # --------------------------------------------------------

  include_confidence: True

  include_reliability: True

  include_review_flag: True

  include_evidence: True

  include_source_metadata: True

  include_extraction_metadata: True

  # --------------------------------------------------------
  # Numeric normalization
  # --------------------------------------------------------

  round_amount_digits: 2

  round_confidence_digits: 4

  # --------------------------------------------------------
  # Reliability thresholds
  # --------------------------------------------------------

  medium_confidence_threshold:  0.90

  low_confidence_threshold: 0.70

  # --------------------------------------------------------
  # Batch behavior
  # --------------------------------------------------------

  save_manifest: True

  schema_version: "1.0"
