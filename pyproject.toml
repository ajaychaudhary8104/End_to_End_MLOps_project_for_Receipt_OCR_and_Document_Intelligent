[build-system]
requires = [
    "setuptools>=68",
    "wheel>=0.42"
]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-intelligence"
version = "0.1.0"
description = "Production-oriented receipt OCR and document intelligence system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "AJAY CHAUDHARY" }
]
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.1",
    "scikit-learn==1.4.2",
    "scipy==1.13.0",
    "joblib==1.3.2",
    "opencv-python==4.10.0.84",
    "Pillow==10.3.0",
    "paddleocr==2.8.1",
    "paddlepaddle==3.0.0",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "mlflow==2.12.1",
    "dagshub==0.3.28",
    "protobuf<5",
    "dvc==3.51.2",
    "pathspec==0.11.2",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.1",
    "python-box==7.1.1",
    "ensure==1.0.4",
    "requests==2.31.0",
    "urllib3==2.2.1",
    "certifi==2024.2.2",
    "click==8.1.7",
    "colorama==0.4.6",
    "tqdm==4.66.2",
    "boto3==1.34.131",
    "botocore==1.34.131",
    "feast>=0.38.0,<0.45.0",
    "fastapi==0.109.2",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.6.4",
    "python-multipart==0.0.32"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]